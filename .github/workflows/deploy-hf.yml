# بينشر الموقع على Hugging Face Spaces مع كل push على main.
# محتاج secret واحد بس في إعدادات الريبو: HF_TOKEN (توكن Hugging Face نوعه Write).
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python .github/scripts/deploy_hf.py
